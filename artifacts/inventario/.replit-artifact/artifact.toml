kind = "mobile"
previewPath = "/"
title = "Inventario"
version = "1.0.0"
id = "artifacts/inventario"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25913

[services.development]
run = "pnpm --filter @workspace/inventario run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/inventario", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/inventario", "run", "serve" ]

[services.env]
PORT = "25913"
BASE_PATH = "/"
